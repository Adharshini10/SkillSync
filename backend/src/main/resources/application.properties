# ============================================================
#  SkillSync – Application Properties
#  (development profile – do NOT commit credentials to git)
# ============================================================

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── Application name ────────────────────────────────────────
spring.application.name=skillsync-backend

# ── MySQL DataSource ─────────────────────────────────────────
# Replace <username> and <password> with your local MySQL credentials.
# The database "skillsync" must be created in MySQL before starting.
#
#   CREATE DATABASE skillsync CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillsync?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Adharshini}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# update  : applies schema changes automatically (good for dev)
# validate: only validates schema (recommended for production)
# create  : drops and recreates tables on startup (use with caution)p
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Logging ──────────────────────────────────────────────────
logging.level.com.skillsync=DEBUG
logging.level.org.springframework.web=INFO

# ── JWT ──────────────────────────────────────────────────────
# Secret key: minimum 256-bit Base64-encoded string.
# Generate a strong one for production; this is a dev placeholder.
jwt.secret=${JWT_SECRET:5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F}
# Token expiry: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=86400000
